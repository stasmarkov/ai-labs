# ddev generic/default/php config for apache2

# Taken over from ddev: the generated-file marker is removed so ddev keeps this file.
# See https://docs.ddev.com/en/stable/users/extend/customization-extendibility/#custom-apache-configuration
# mod_proxy_fcgi holds PHP-FPM output back until a buffer fills. flushpackets=on passes each chunk
# to the client at once, which text/event-stream responses (GET /listings/{id}/describe) need.
<Proxy "unix:/var/run/php/php-fpm.sock|fcgi://localhost">
    ProxySet flushpackets=on
</Proxy>

<VirtualHost *:80>
    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} =https
    RewriteCond    %{DOCUMENT_ROOT}%{REQUEST_FILENAME} -d
    RewriteRule    ^(.+[^/])$           https://%{HTTP_HOST}$1/ [redirect,last]

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    # SL-11: mod_xsendfile serves the file named by PHP's X-Sendfile header. XSendFilePath is the
    # allow-list: any other path in the header is refused, so only the exports directory is reachable.
    XSendFile On
    XSendFilePath /var/www/html/storage/app/exports/

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public
    <Directory "/var/www/html/public/">
      AllowOverride All
      Allow from All
    </Directory>
    # Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
    # error, crit, alert, emerg.
    # It is also possible to configure the loglevel for particular
    # modules, e.g.
    #LogLevel info ssl:warn

    ErrorLog /dev/stdout
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # For most configuration files from conf-available/, which are
    # enabled or disabled at a global level, it is possible to
    # include a line for only one particular virtual host. For example the
    # following line enables the CGI configuration for this host only
    # after it has been globally disabled with "a2disconf".
    #Include conf-available/serve-cgi-bin.conf

    # Increase allowed field size for large cookies header.
    LimitRequestFieldSize 16380

    # Simple ddev technique to get a phpstatus
    Alias "/phpstatus" "/var/www/phpstatus.php"
    # A nocopy volume can shadow /var/www/phpstatus.php under Mutagen, so proxy it
    # unconditionally, bypassing the php*-fpm.conf `-f %{REQUEST_FILENAME}` guard
    # (nginx's /phpstatus location does the same).
    <Location "/phpstatus">
        SetHandler "proxy:unix:/var/run/php/php-fpm.sock|fcgi://localhost"
    </Location>
    Alias "/xhprof" "/var/xhprof/xhprof_html"
    <Directory "/var/xhprof">
        Options Indexes
        AllowOverride None
        Require all granted
    </Directory>

</VirtualHost>

<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/master.crt
    SSLCertificateKeyFile /etc/ssl/certs/master.key

    # Workaround from https://mail-archives.apache.org/mod_mbox/httpd-users/201403.mbox/%3C49404A24C7FAD94BB7B45E86A9305F6214D04652@MSGEXSV21103.ent.wfb.bank.corp%3E
    # See also https://gist.github.com/nurtext/b6ac07ac7d8c372bc8eb

    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} =https
    RewriteCond    %{DOCUMENT_ROOT}%{REQUEST_FILENAME} -d
    RewriteRule    ^(.+[^/])$           https://%{HTTP_HOST}$1/ [redirect,last]

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    # SL-11: mod_xsendfile serves the file named by PHP's X-Sendfile header. XSendFilePath is the
    # allow-list: any other path in the header is refused, so only the exports directory is reachable.
    XSendFile On
    XSendFilePath /var/www/html/storage/app/exports/

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public
    <Directory "/var/www/html/public/">
      AllowOverride All
      Allow from All
    </Directory>
    # Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
    # error, crit, alert, emerg.
    # It is also possible to configure the loglevel for particular
    # modules, e.g.
    #LogLevel info ssl:warn

    ErrorLog /dev/stdout
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Increase allowed field size for large cookies header.
    LimitRequestFieldSize 16380

    # For most configuration files from conf-available/, which are
    # enabled or disabled at a global level, it is possible to
    # include a line for only one particular virtual host. For example the
    # following line enables the CGI configuration for this host only
    # after it has been globally disabled with "a2disconf".
    #Include conf-available/serve-cgi-bin.conf
    # Simple ddev technique to get a phpstatus
    Alias "/phpstatus" "/var/www/phpstatus.php"
    # A nocopy volume can shadow /var/www/phpstatus.php under Mutagen, so proxy it
    # unconditionally, bypassing the php*-fpm.conf `-f %{REQUEST_FILENAME}` guard
    # (nginx's /phpstatus location does the same).
    <Location "/phpstatus">
        SetHandler "proxy:unix:/var/run/php/php-fpm.sock|fcgi://localhost"
    </Location>
    Alias "/xhprof" "/var/xhprof/xhprof_html"
    <Directory "/var/xhprof">
        Options Indexes
        AllowOverride None
        Require all granted
    </Directory>

</VirtualHost>
