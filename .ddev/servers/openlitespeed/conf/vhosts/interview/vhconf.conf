docRoot                   /var/www/html/public
enableGzip                1

index {
  useServer               0
  indexFiles              index.php
  autoIndex               0
}

errorlog /usr/local/lsws/logs/vhost-error.log {
  useServer               1
  logLevel                ERROR
  rollingSize             10M
}

accesslog /usr/local/lsws/logs/vhost-access.log {
  useServer               0
  rollingSize             10M
  keepDays                7
  compressArchive         0
}

context / {
  location                /var/www/html/public/
  allowBrowse             1
  rewrite {
    RewriteFile           .htaccess
  }
}

# SL-11: target of PHP's X-LiteSpeed-Location header, mapped to the exports directory only. Its
# own rewrite block turns off the Laravel front-controller rules, which would otherwise swallow the
# URI. OpenLiteSpeed has no "internal" flag, so the vhost rewrite rules below answer 403 when the
# client itself asked for the URI. Content-Type comes from the file extension: the image's
# mime.properties maps csv to text/csv (see the Dockerfile next to conf/).
context /_protected_exports/ {
  location                /var/www/html/storage/app/exports/
  allowBrowse             1
  extraHeaders            X-Export-Mode offload
  rewrite {
    enable                0
    inherit               0
  }
}

rewrite {
  enable                  1
  autoLoadHtaccess        1
  logLevel                0
  rules                   <<<END_rules
RewriteCond %{HTTP:X-Forwarded-Proto} =https
RewriteRule .* - [E=HTTPS:on]
# SL-11: deny the internal context to clients, whatever the encoding. %{REQUEST_URI} is the decoded
# path, so /%5Fprotected_exports/, //_protected_exports/ and /%2e/_protected_exports/ all match the
# first condition. After PHP's X-LiteSpeed-Location redirect the rules run again with the new URI,
# but %{THE_REQUEST} still holds the client's original request line: the second condition lets
# through only a request line that is exactly GET/HEAD /exports/<id> (id has no dot, slash or percent).
RewriteCond %{REQUEST_URI} "_protected_exports" [NC]
RewriteCond %{THE_REQUEST} "!^(GET|HEAD) /exports/[a-z0-9-]{1,40}(\?[^ ]*)? HTTP/"
RewriteRule .* - [F,L]
END_rules
}
