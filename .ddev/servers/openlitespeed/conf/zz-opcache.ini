; Match the DDEV web container's PHP-FPM OPcache settings so benchmarks compare the
; servers, not their cache sizes. lsphp84 defaults: memory_consumption=128,
; max_accelerated_files=10000, interned_strings_buffer=8. revalidate_freq=2 is the
; same on both.
opcache.enable=1
opcache.memory_consumption=500
opcache.max_accelerated_files=1000000
opcache.interned_strings_buffer=16
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.jit=off
