serverName                interview
user                      ols
group                     ols
priority                  0
autoRestart               1
enableChroot              0
inMemBufSize              60M
swappingDir               /tmp/lshttpd/swap
autoFix503                1
gracefulRestartTimeout    300
mime                      conf/mime.properties
showVersionNumber         0
indexFiles                index.php, index.html
disableWebAdmin           1

errorlog logs/error.log {
  logLevel                ERROR
  debugLevel              0
  rollingSize             10M
  enableStderrLog         1
}

accessLog logs/access.log {
  rollingSize             10M
  keepDays                30
  compressArchive         0
}

tuning {
  maxConnections          10000
  connTimeout             300
  maxKeepAliveReq         10000
  keepAliveTimeout        5
  enableGzipCompress      1
  enableDynGzipCompress   1
  quicEnable              0
}

accessDenyDir {
  dir                     /
  dir                     /etc/*
  dir                     /dev/*
  dir                     conf/*
  dir                     admin/conf/*
}

fileAccessControl {
  followSymbolLink        1
  checkSymbolLink         0
  requiredPermissionMask  000
  restrictedPermissionMask 000
}

CGIRLimit {
  maxCGIInstances         20
  minUID                  11
  minGID                  10
}

accessControl {
  allow                   ALL
}

extprocessor lsphp {
  type                    lsapi
  address                 uds://tmp/lshttpd/lsphp.sock
  maxConns                10
  env                     PHP_LSAPI_CHILDREN=10
  env                     LSAPI_AVOID_FORK=200M
  initTimeout             60
  retryTimeout            0
  persistConn             1
  respBuffer              0
  autoStart               1
  path                    /usr/local/lsws/lsphp84/bin/lsphp
  backlog                 100
  instances               1
  extUser                 ols
  extGroup                ols
  priority                0
  memSoftLimit            0
  memHardLimit            0
  procSoftLimit           1400
  procHardLimit           1500
}

scripthandler {
  add                     lsapi:lsphp php
}

virtualhost interview {
  vhRoot                  /var/www/html
  configFile              conf/vhosts/interview/vhconf.conf
  allowSymbolLink         1
  enableScript            1
  restrained              0
  setUIDMode              0
}

listener Default {
  address                 *:8088
  secure                  0
  map                     interview *
}
