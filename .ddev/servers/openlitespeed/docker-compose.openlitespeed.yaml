services:
  openlitespeed:
    container_name: ddev-${DDEV_SITENAME}-openlitespeed
    build:
      context: ./servers/openlitespeed
      args:
        DDEV_UID: ${DDEV_UID}
        DDEV_GID: ${DDEV_GID}
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    expose:
      - "8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTPS_EXPOSE=8091:8088
    volumes:
      - ${DDEV_APPROOT}:/var/www/html
    networks:
      - default
      - ddev_default
networks:
  ddev_default:
    name: ddev_default
    external: true
